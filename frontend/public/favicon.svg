<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Job Paglu favicon — dark brand, matching the apex site jobpaglu.eu.cc.

       Same globe mark as the wordmark glyph in src/components/Logo.astro: a
       circle and a single meridian. A solid dark tile with the glyph stroked in
       the brand cyan, so it reads as a block of brand colour at 16px rather than
       thin strokes on transparency that vanish.

       Colours are literals because SVG cannot read a CSS custom property:
       #14141d is --jp-c-base-850 (the surface) and #22d3ee is --jp-c-cyan-400
       (--jp-brand), both in src/styles/tokens.css. Change them together. -->
  <rect width="32" height="32" rx="7" fill="#14141d"/>
  <g fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round">
    <circle cx="16" cy="16" r="8"/>
    <path d="M16 8c3 2.6 3 12.8 0 16M8 16h16"/>
  </g>
</svg>
